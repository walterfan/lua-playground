worker_processes 1;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    lua_package_path "/app/lua/?.lua;;";
    lua_code_cache off;

    # 10 requests/minute per IP, with a small burst for interactive use.
    limit_req_zone $binary_remote_addr zone=exec_limit:5m rate=10r/m;

    server {
        listen 80;
        server_name localhost;
        default_type text/html;

        location = / {
            root /app/html;
            try_files /index.html =404;
        }

        location = /run {
            limit_req zone=exec_limit burst=5 nodelay;
            # Keep the form body in memory so a 16 KB script can be measured
            # before NGINX spills it to a temp file.
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            content_by_lua_file /app/lua/executor.lua;
        }

        location = /snippets {
            content_by_lua_file /app/lua/snippets_api.lua;
        }

        location = /snippets/save {
            limit_req zone=exec_limit burst=5 nodelay;
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            content_by_lua_file /app/lua/snippets_api.lua;
        }

        location = /snippets/delete {
            limit_req zone=exec_limit burst=5 nodelay;
            client_max_body_size 64k;
            client_body_buffer_size 64k;
            content_by_lua_file /app/lua/snippets_api.lua;
        }

        # Internal directory listing consumed by snippets_api.lua.
        location = /snippet-index/ {
            internal;
            alias /app/snippets/;
            autoindex on;
            autoindex_format json;
        }
    }
}
